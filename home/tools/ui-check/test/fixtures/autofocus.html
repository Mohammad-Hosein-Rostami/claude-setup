<!doctype html><meta charset="utf-8"><body>
<input id="first" autofocus><input id="other">
<script>
// ?lose simulates Chromium skipping autofocus (the race seen on the mock login-otp-sms page); ?other focuses a different field.
const mode = new URLSearchParams(location.search).get('mode');
if (mode === 'lose') window.addEventListener('load', () => setTimeout(() => document.activeElement.blur(), 50));
if (mode === 'other') document.getElementById('other').focus();
</script>

<!doctype html><meta charset="utf-8">
<style>@font-face{font-family:Inter;src:url(fonts/inter-600-ascii.woff) format("woff");font-weight:600}</style>
<body style="margin:0;background:#eee;font-family:Helvetica,Arial,sans-serif">
<div id="card" style="box-sizing:border-box;width:300px;height:120px;padding:16px;background:#fff;border-radius:8px;display:flex;flex-direction:column;gap:16px">
<h1 style="margin:0;font-family:Inter,Helvetica,Arial,sans-serif;width:100px;font-size:20px;font-weight:600;line-height:24px;letter-spacing:-0.2px">Hello</h1>
<p style="margin:0;width:268px;font-size:14px;font-weight:400;line-height:20px">Text</p></div>
<script>const q=new URLSearchParams(location.search); const l=q.get('padl'); if(l) document.getElementById('card').style.paddingLeft=l+'px';
// ?font=absent asks for a family no machine has (a stand-in for a font the page never loads), so a fallback draws the title.
if(q.get('font')==='absent') document.querySelector('h1').style.fontFamily='UiCheckAbsentFont,Helvetica,Arial,sans-serif';</script>

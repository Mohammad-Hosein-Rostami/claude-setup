<!doctype html><meta charset="utf-8">
<!-- A correct page whose text sits more than two levels below the mapped element, in fields, in a shadow root and in generated content;
     every element is drawn in the Inter web font. #empty and #image have no text. -->
<style>
@font-face{font-family:Inter;src:url(inter-600-ascii.woff) format("woff");font-weight:600}
#root *{font:600 20px/24px Inter}
#icon::before{content:"Go "}
</style>
<div id="root">
<h1 id="link"><a href="#"><span>Hello</span></a></h1>
<button id="button"><span><span><em>Send</em></span></span></button>
<label id="label">Name<input value="Ada"></label>
<textarea id="notes">Notes</textarea>
<input id="search" placeholder="Search">
<div id="host"><x-card><b>Slotted</b></x-card></div>
<p id="icon">Now</p>
<input id="empty">
<img id="image" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
</div>
<script>
customElements.define('x-card', class extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' }).innerHTML = '<style>p{margin:0;font:600 20px Inter}</style><p>Shadow <slot></slot></p>';
  }
});
</script>

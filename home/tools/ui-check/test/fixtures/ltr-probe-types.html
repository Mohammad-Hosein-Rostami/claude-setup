<!doctype html><html dir="rtl" lang="fa"><meta charset="utf-8"><title>probe types</title>
<!-- Empty fields of every type that is not text-like: the audit must not touch them (a file field throws when it is given a value, a date field drops it). -->
<body style="margin:0;font:16px sans-serif">
<input id="date" type="date" style="display:block;width:200px;height:40px">
<input id="file" type="file" style="display:block;width:200px;height:40px">
<input id="range" type="range" style="display:block;width:200px;height:40px">
<input id="color" type="color" style="display:block;width:200px;height:40px">
<input id="check" type="checkbox" style="display:block;width:24px;height:24px">
<input id="emptycheck" type="checkbox" value="" style="display:block;width:24px;height:24px">
<input id="radio" type="radio" style="display:block;width:24px;height:24px">
<input id="time" type="time" style="display:block;width:200px;height:40px">
<input id="submit" type="submit" value="ارسال" style="display:block;width:200px;height:40px">
<input id="bogus" type="nonsense" style="display:block;width:200px;height:40px">
<input id="mail" type="email" style="display:block;width:200px;height:40px">
<textarea id="note" style="display:block;width:200px;height:60px"></textarea>
<textarea id="filled" style="display:block;width:200px;height:60px">secret note: hunter2 and more words</textarea>
</body></html>
